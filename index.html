<style>html,body{margin:0;padding:0;height:100%;background:#0b1428;overflow:hidden}

<body>
<div id=load><div><div style="color:#F2C14E;font-weight:800;letter-spacing:3px;font-size:13px">TEST GROUP</div>
<div style="color:#fff;font-weight:800;font-size:20px;margin-top:6px">MV + SPOT · Run-and-Grade</div>

<div style="margin-top:12px">Loading the current version…</div></div></div>
<iframe id=app title="MV + SPOT · Run-and-Grade" allow="clipboard-write; fullscreen"></iframe>
<script>
// Load the freshest copy INSIDE this page (keeps the Home-Screen icon), unique URL defeats caching.
var TOOL="MV_SPOT_Run_and_Grade.html";
var f=document.getElementById('app');
f.onload=function(){ var l=document.getElementById('load'); if(l) l.style.display='none'; };
f.src = TOOL + (TOOL.indexOf("?")<0?"?":"&") + "v=" + Date.now();
</script><style id="aqp-off-css">
#aqpOffPill{position:fixed;left:10px;bottom:10px;z-index:2147483000;background:#7a4b00;color:#fff;font:600 12px -apple-system,Segoe UI,Arial,sans-serif;padding:6px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;opacity:.92;display:none}
#aqpOffToast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483001;background:#14532d;color:#fff;font:600 13px -apple-system,Segoe UI,Arial,sans-serif;padding:9px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;max-width:92vw;text-align:center}
#aqpOffToast button{margin-left:10px;background:#F2C14E;color:#1b2a44;border:0;border-radius:7px;font:700 13px -apple-system,Arial,sans-serif;padding:5px 10px}
</style>
<script>
/* Offline support: keeps a copy of this app on the iPad so it opens with no internet.
 * With internet it always loads the newest version first. Add ?nosw=1 to the address to turn it off on a device. */
(function(){
  var SW_URL="sw.js", WARM=["index.html", "./", "MV_SPOT_Run_and_Grade.html", "icon.png"], OPT=[], ID="TG_MV";
  if(!("serviceWorker" in navigator) || !window.caches) return;
  function el(id){ return document.getElementById(id); }
  function pill(){ var p=el("aqpOffPill"); if(!p){ p=document.createElement("div"); p.id="aqpOffPill"; p.textContent="Offline · using the copy saved on this iPad"; document.body.appendChild(p); } p.style.display = navigator.onLine===false ? "block" : "none"; }
  function toast(html, ms){ var t=el("aqpOffToast"); if(!t){ t=document.createElement("div"); t.id="aqpOffToast"; document.body.appendChild(t); } t.innerHTML=html; t.style.display="block"; clearTimeout(t._h); if(ms) t._h=setTimeout(function(){ t.style.display="none"; }, ms); return t; }
  window.addEventListener("online", pill); window.addEventListener("offline", pill);
  if(document.body) pill(); else document.addEventListener("DOMContentLoaded", pill);

  if(/[?&]nosw=1/.test(location.search)){
    navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })
      .then(function(){ return caches.keys(); }).then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf("aqp-offline-")===0; }).map(function(k){ return caches.delete(k); })); })
      .then(function(){ toast("Offline copy removed from this device.", 5000); });
    return;
  }

  navigator.serviceWorker.addEventListener("message", function(e){
    var d=e.data||{};
    if(d.type==="aqp-updated"){
      var t=toast("A newer version was downloaded.<button type=button>Update now</button>", 0);
      t.querySelector("button").onclick=function(){ location.reload(); };
    }
    if(d.type==="aqp-warmed" && !d.optional && d.ok===d.total){
      var k="AQP_OFFLINE_READY_"+ID, seen=null;
      try{ seen=localStorage.getItem(k); }catch(x){}
      if(!seen){ toast("✓ Saved on this iPad — this app now opens without internet.", 6000); try{ localStorage.setItem(k, String(Date.now())); }catch(x){} }
    }
  });

  window.addEventListener("load", function(){
    var scope=SW_URL.replace(/sw\.js$/,"");
    navigator.serviceWorker.register(SW_URL, {scope:scope}).then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){
      if(navigator.onLine===false || !reg.active) return;
      var here=location.href.split("#")[0].split("?")[0];
      var urls=[here].concat(WARM.map(function(u){ return new URL(u, location.href).href; }));
      reg.active.postMessage({type:"aqp-warm", urls:urls});
      if(OPT.length) reg.active.postMessage({type:"aqp-warm", optional:true, urls:OPT.map(function(u){ return new URL(u, location.href).href; })});
    }).catch(function(){});
  });
})();
</script>
